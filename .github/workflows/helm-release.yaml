name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/hyundai-monitor/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  # Read-only on packages, to check that the image this chart points at exists
  # before the chart is published.
  packages: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This workflow is not otherwise coupled to the image build, so without
      # this gate a chart whose appVersion names an image that was never
      # published would go out. The failure would surface as ImagePullBackOff
      # during an upgrade, and because the Deployment uses strategy Recreate the
      # old pod is already gone by then: collection stops until someone rolls
      # back. Refuse to publish instead.
      #
      # The image tag only appears once the matching `v<appVersion>` git tag is
      # pushed, so this also enforces the release order: tag first, publish the
      # chart second. The wait covers a tag and a chart change pushed together.
      - name: Verify the image for the chart's appVersion exists
        env:
          IMAGE: ghcr.io/jvhaarst/hyundai-monitor
        run: |
          set -euo pipefail
          APP_VERSION=$(yq '.appVersion' charts/hyundai-monitor/Chart.yaml)
          REF="${IMAGE}:${APP_VERSION}"
          echo "Chart appVersion: ${APP_VERSION}"
          echo "Required image:   ${REF}"

          found=false
          for attempt in $(seq 1 20); do
            if docker buildx imagetools inspect "$REF" --raw > /tmp/manifest.json 2>/tmp/inspect.err; then
              found=true
              break
            fi
            echo "attempt ${attempt}/20: ${REF} not available yet, waiting 30s"
            sleep 30
          done

          if [ "$found" != "true" ]; then
            cat /tmp/inspect.err >&2 || true
            echo "::error::${REF} does not exist. Push the matching git tag (v${APP_VERSION}) and let \"Build and Push Container\" publish the image before releasing the chart."
            exit 1
          fi

          # arm64 is the only architecture the cluster can actually run.
          if ! jq -e '.manifests' /tmp/manifest.json > /dev/null; then
            echo "::error::${REF} is a single-platform image; the Raspberry Pi nodes need linux/arm64 in a manifest list."
            exit 1
          fi
          jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
            /tmp/manifest.json | sort -u | tee /tmp/platforms.txt
          if ! grep -qx 'linux/arm64' /tmp/platforms.txt; then
            echo "::error::${REF} has no linux/arm64 platform."
            exit 1
          fi
          echo "${REF} exists and covers linux/arm64."

      - name: Download existing index (if exists)
        id: existing-index
        continue-on-error: true
        run: |
          curl -fsSL https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.yaml -o existing-index.yaml
          echo "exists=true" >> $GITHUB_OUTPUT

      - name: Auto-bump chart version if needed
        run: |
          CHART_FILE="charts/hyundai-monitor/Chart.yaml"
          CURRENT_VERSION=$(yq '.version' "$CHART_FILE")
          echo "Current chart version: $CURRENT_VERSION"

          if [ -f existing-index.yaml ]; then
            EXISTING_VERSIONS=$(yq '.entries.hyundai-monitor[].version' existing-index.yaml 2>/dev/null || echo "")
            if echo "$EXISTING_VERSIONS" | grep -q "^${CURRENT_VERSION}$"; then
              echo "Version $CURRENT_VERSION already exists in index, bumping patch version..."

              MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
              MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
              PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

              echo "Bumping version to: $NEW_VERSION"
              yq -i ".version = \"$NEW_VERSION\"" "$CHART_FILE"

              git add "$CHART_FILE"
              git commit -m "chore: bump chart version to $NEW_VERSION [skip ci]"
              git push
            else
              echo "Version $CURRENT_VERSION is new, no bump needed"
            fi
          else
            echo "No existing index found, this is the first release"
          fi

      - name: Package Helm chart
        run: |
          mkdir -p .helm-release
          helm package charts/hyundai-monitor -d .helm-release

      - name: Generate Helm repo index
        run: |
          cd .helm-release
          if [ -f ../existing-index.yaml ]; then
            helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} --merge ../existing-index.yaml
          else
            helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.helm-release'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
