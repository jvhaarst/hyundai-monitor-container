apiVersion: v2
name: hyundai-monitor
description: IONIQ 5 telemetry collector (hyundai_kia_connect_monitor) appending cached readings to CSV history on a persistent volume
type: application
version: 0.1.1
# The image built from this repository, tagged from the repository's own release
# tags. Not the upstream collector version: upstream publishes no releases, so
# the pinned commit lives in the Dockerfile where Renovate can see it.
appVersion: "0.1.0"
keywords:
  - hyundai
  - ioniq5
  - telemetry
  - bluelink
home: https://github.com/jvhaarst/hyundai-monitor-container
sources:
  - https://github.com/jvhaarst/hyundai-monitor-container
  - https://github.com/ZuinigeRijder/hyundai_kia_connect_monitor
  - https://github.com/Hyundai-Kia-Connect/hyundai_kia_connect_api
maintainers:
  - name: jvhaarst
