{{- if not .Values.credentials.existingSecret }}
{{- if or (not .Values.credentials.username) (not .Values.credentials.password) }}
{{- fail "credentials: set credentials.existingSecret, or both credentials.username and credentials.password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyundai-monitor.secretName" . }}
  labels:
    {{- include "hyundai-monitor.labels" . | nindent 4 }}
type: Opaque
data:
  # b64enc of the raw value: the entrypoint writes it with printf '%s', so a
  # '%' in the password needs no escaping anywhere in this path.
  username: {{ .Values.credentials.username | b64enc | quote }}
  password: {{ .Values.credentials.password | b64enc | quote }}
  # Empty on this account: region 1 (Europe) logs in without a pin. The key
  # exists either way, because the collector reads it.
  pin: {{ .Values.credentials.pin | default "" | toString | b64enc | quote }}
{{- end }}
